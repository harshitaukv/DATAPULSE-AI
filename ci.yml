name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datapulse
          POSTGRES_PASSWORD: datapulse_ci
          POSTGRES_DB: datapulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datapulse" --health-interval 5s --health-timeout 3s --health-retries 20
    strategy:
      matrix:
        database: [sqlite, postgresql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg2://datapulse:datapulse_ci@localhost:5432/datapulse_test' || '' }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then unset TEST_DATABASE_URL; fi
          python -m pytest -q
      - name: Check migrations match models
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/ci_migration.db
        run: |
          alembic upgrade head
          alembic check

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --target backend -t datapulse-backend .
      - name: Build frontend image
        run: docker build --target frontend -t datapulse-frontend .
